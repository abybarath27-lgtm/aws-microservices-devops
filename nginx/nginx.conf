events {
    worker_connections 1024;
}

http {
    upstream user_backend {
        server user-service:3001;
    }

    upstream product_backend {
        server product-service:3002;
    }

    upstream order_backend {
        server order-service:3003;
    }

    server {
        listen 80;

        location = /api/users {
            proxy_pass http://user_backend/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /api/products {
            proxy_pass http://product_backend/products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /api/orders {
            proxy_pass http://order_backend/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            default_type application/json;
            return 200 '{"application":"Microservices API Gateway","status":"running","endpoints":["/api/users","/api/products","/api/orders"]}';
        }
    }
}
