services:
  user-service:
    build:
      context: ./services/user-service
    image: ${USER_IMAGE:-user-service:local}
    container_name: user-service
    environment:
      PORT: 3001
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - microservices-network

  product-service:
    build:
      context: ./services/product-service
    image: ${PRODUCT_IMAGE:-product-service:local}
    container_name: product-service
    environment:
      PORT: 3002
    expose:
      - "3002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - microservices-network

  order-service:
    build:
      context: ./services/order-service
    image: ${ORDER_IMAGE:-order-service:local}
    container_name: order-service
    environment:
      PORT: 3003
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    expose:
      - "3003"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - microservices-network

  nginx:
    image: nginx:alpine
    container_name: microservices-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
